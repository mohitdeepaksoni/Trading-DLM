name: shadow-chain

on:
  schedule:
    # FALLBACK ONLY since 2026-10-16: the persistent node runs the job at 00:15 UTC and pushes the record, so this 05:00 UTC
    # run finds the day's files already in the pulled record and exits early (nightly.sh is idempotent per UTC day). It does
    # the work only when the node was down. One cron, late, so the two can never build the same day concurrently.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: shadow-chain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # Sunday runs carry the NSE fundamentals refresh (~60-90 min on the runner)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install runner requirements
        run: pip install -r requirements-shadow.txt

      - name: pull state from the private HF dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/shadow_sync.py pull

      - name: nightly shadow job (signals, chain, ledger, OpenTimestamps, integrity)
        run: bash scripts/nightly.sh

      - name: push state back
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/shadow_sync.py push

      - name: keep the signal files as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-signals-${{ github.run_id }}
          path: runs/signals
          retention-days: 90
