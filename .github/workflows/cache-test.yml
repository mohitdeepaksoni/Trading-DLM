name: cache-test
on: workflow_dispatch
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p /home/runner/.cache/shadow-mirror/a && echo hello > /home/runner/.cache/shadow-mirror/a/x.txt
      - uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/shadow-mirror
          key: cachetest-${{ github.run_id }}
  restore:
    needs: save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/shadow-mirror
          key: cachetest-none
          restore-keys: cachetest-
      - run: cat /home/runner/.cache/shadow-mirror/a/x.txt
